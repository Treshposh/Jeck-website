<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JECK Virtual Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Layout: a 3D map is the stage; a slim HUD sits on top; each place opens into its photograph as a 3D scene. */
html,body{height:100%;overflow:hidden;margin:0}
body{background:#cfe3d4}
[hidden]{display:none!important}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.tbar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(10,42,31,.7),rgba(10,42,31,0));pointer-events:none}
.tbar > *{pointer-events:auto}
.tmark{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.tmark img{width:40px}
.tmark b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1}
.tmark small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);font-weight:700}
.tact{display:flex;gap:8px;align-items:center}
.hb{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,42,31,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.hb:hover{background:rgba(10,42,31,.75)}
.hb.gold{background:var(--sun);color:var(--green);border-color:var(--sun)}
@media (max-width:600px){.hb.hide-s{display:none}.tmark b{font-size:19px}}
#labels{position:fixed;inset:0;z-index:10;pointer-events:none}
.rlabel{position:absolute;left:0;top:0;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px rgba(10,40,29,.18);will-change:transform;transition:opacity .4s}
.rlabel.school{background:var(--green);color:#fff;letter-spacing:.04em;text-transform:none;font-size:14px;font-family:var(--serif);font-weight:400;padding:7px 14px}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:#fff;color:var(--green);font:inherit;font-weight:700;font-size:14px;white-space:nowrap;border:0;box-shadow:0 8px 22px rgba(10,40,29,.28);pointer-events:auto;cursor:pointer;will-change:transform;opacity:0;transition:opacity .5s,background .2s}
.pin b{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;position:relative}
.pin b::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sun);animation:ping 2s var(--glide) infinite}
@keyframes ping{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.pin:hover{background:var(--sun)}
.pin.seen b{background:var(--sun);color:var(--green)}
.on-campus .pin{opacity:1}
.card{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:#fff;border-radius:22px;padding:24px;box-shadow:0 24px 60px rgba(10,40,29,.3);display:grid;gap:12px;animation:up .7s var(--spring)}
@keyframes up{from{transform:translateY(30px) scale(.95);opacity:0}}
.card .k{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card h1,.card h2{font-family:var(--serif);font-weight:400;color:var(--green);font-size:34px;line-height:1.05;margin:0}
.card p{color:var(--mute);margin:0;font-size:16px}
.route{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:rgba(255,255,255,.95);border-radius:999px;padding:10px 10px 10px 22px;box-shadow:0 14px 34px rgba(10,40,29,.25);display:flex;align-items:center;gap:14px}
.route ol{list-style:none;margin:0;padding:0;display:flex;flex:1;justify-content:space-between;gap:8px;min-width:0;font-size:13px;font-weight:700;color:var(--mute)}
.route li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.route li.on{color:var(--green)}
.route li.on::before{content:"● ";color:var(--sun)}
.route .btn{min-height:40px;padding:0 16px;font-size:14px;flex:none}
@media (max-width:520px){.route li:not(.on){display:none}}
.toast{position:fixed;z-index:16;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 10px 26px rgba(10,40,29,.3);white-space:nowrap;animation:up .6s var(--spring)}
.stops{position:fixed;z-index:25;inset:0;background:rgba(10,40,29,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.stops .sheet{width:min(860px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:24px;padding:24px;display:grid;gap:16px;animation:up .6s var(--spring)}
.stops .sh{display:flex;justify-content:space-between;align-items:center}
.stops h2{font-family:var(--serif);font-weight:400;font-size:32px;color:var(--green);margin:0}
.stops .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.stops .grid{grid-template-columns:1fr 1fr}}
.stops .grid button{display:grid;text-align:left;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--paper);cursor:pointer;font:inherit;transition:transform .35s var(--spring)}
.stops .grid button:hover{transform:translateY(-3px)}
.stops .grid img{width:100%;aspect-ratio:16/10;object-fit:cover}
.stops .grid span{padding:10px 12px;font-weight:700;color:var(--green);font-size:14px}
.xbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);color:var(--green);display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
/* stepping into a place */
.flash{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 50%,#fff6d6,#f2c318 60%,#0f3b2b);opacity:0;pointer-events:none;transition:opacity .45s}
.flash.on{opacity:1}
.place{position:fixed;inset:0;z-index:28;background:#0a2a1f}
.place .film{position:absolute;inset:0}
.place .shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(8,32,24,.5),rgba(8,32,24,0) 25%,rgba(8,32,24,0) 50%,rgba(8,32,24,.85))}
.place .info{position:absolute;z-index:3;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));color:#fff;display:grid;gap:12px;max-width:640px}
.place .info .k{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.place .info h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,76px);line-height:1;color:#fff;margin:0}
.place .info p{color:#e2ece6;font-size:18px;margin:0;max-width:54ch}
.place .info .row{margin-top:6px}
.place .top{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.place .film-ctrl{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px));right:max(72px,calc(env(safe-area-inset-right,0px) + 72px))}
.place .film-dots{display:none}
.place.in .info > *{animation:rise .9s var(--glide) both}
.place.in .info > *:nth-child(2){animation-delay:.08s}.place.in .info > *:nth-child(3){animation-delay:.16s}.place.in .info > *:nth-child(4){animation-delay:.24s}
.nogl-msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
</style>
</head><body>
<canvas id="map" aria-label="3D map from Oro-Igwe Road to JECK Comprehensive College"></canvas>
<div id="labels" aria-hidden="true"></div>

  <div class="tact">
    <button class="hb" id="btnStops" hidden>All places</button>
    <a class="hb hide-s" href="https://www.google.com/maps/search/?api=1&query=Jeck+Close+Oro-Igwe+Road+Elimgbu+Port+Harcourt" target="_blank" rel="noopener">Directions</a>
    <a class="hb gold" href="index.html">Back to website</a>
  </div>
</header>

<section class="card" id="intro">
  <span class="k">Virtual tour</span>
  <h1>Ride to JECK.</h1>

</section>

</div>

<div class="stops" id="stopsPanel" hidden>
  <div class="sheet"><div class="sh"><h2>Places to visit</h2><button class="xbtn" id="stopsClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="grid" id="stopGrid"></div></div>
</div>

<div class="flash" id="flash"></div>
<section class="place" id="place" hidden aria-live="polite">
  <div id="filmHost"></div>
  <div class="shade"></div>
  <div class="top"><button class="xbtn" id="placeClose" aria-label="Back to the map"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="info">
    <span class="k" id="pK"></span>
    <h2 id="pT"></h2>
    <p id="pP"></p>
    <div class="row"><button class="btn gold" id="pNext">Next place</button><button class="btn line-w" id="pBack">Back to the map</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLACES=[
 {id:'courtyard',name:'Classroom blocks',k:'Classrooms',p:'Three floors of classrooms wrap around a wide, sandy courtyard. This is where the school day begins.',img:'campus',scenes:[['campus',.5,.55]],at:[40,-80]},
 {id:'lab',name:'Science laboratory',k:'Learning',p:'Lab coats on. Science students measure, test and record results in our laboratory, just as real scientists do.',img:'lab',scenes:[['lab',.35,.45]],at:[25,-84]},
 {id:'library',name:'Library',k:'Learning',p:'Shelves of books and a quiet place to read, research and revise. Reading every day is a JECK habit.',img:'library',scenes:[['library',.5,.4]],at:[42,-96]},
 {id:'culture',name:'Cultural day',k:'In front of the main building',p:'Traditional attire, drums and dancing. On cultural day the whole school gathers in front of the main building to celebrate.',img:'cultural',scenes:[['cultural',.5,.6]],at:[58,-80]},
 {id:'field',name:'Sports field',k:'Inter-house sports',p:'March-past squads, house banners and races. Inter-house sports day is one of the loudest days of the year.',img:'jasper',scenes:[['jasper',.5,.58],['gamma',.5,.6]],at:[2,-82]},
 {id:'hall',name:'Graduation hall',k:'Graduation day',p:'Green and gold gowns, proud families and a fresh start. Every year our graduating class celebrates here.',img:'graduation',scenes:[['graduation',.5,.4]],at:[61,-62]},
];

/* ---------- three.js map ---------- */
const canvas=$('map');
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="nogl-msg"><div class="card" style="position:static"><h2>The 3D tour needs WebGL.</h2><p>Open this page in an up-to-date browser, or explore the places below.</p></div></div>');return;}
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe3d4');scene.fog=new THREE.Fog('#cfe3d4',160,380);
const camera=new THREE.PerspectiveCamera(45,1,.5,1000);
scene.add(new THREE.HemisphereLight('#fff7e6','#6f8f5a',.85));
const sun=new THREE.DirectionalLight('#fff1d8',1.35);sun.position.set(-60,110,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:10,far:400});sun.shadow.bias=-.0006;scene.add(sun);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o));
const cast=m=>{m.castShadow=true;m.receiveShadow=true;return m;};
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function plane(w,d,c,x,z,y=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c,{roughness:1}));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
plane(900,900,'#8fb873',0,0);
// roads
const ROAD='#4d5357';
plane(300,11,ROAD,0,0,.05); // Oro-Igwe Road (east-west)
plane(7,58,ROAD,42,-29,.06); // Jeck Close (north to the gate)
plane(12,240,ROAD,-95,-20,.05); // a cross street
plane(5,46,ROAD,-30,-28,.06);plane(5,40,ROAD,95,-25,.06);plane(5,40,ROAD,95,25,.06);plane(5,30,ROAD,-10,20,.06);
const dashM=new THREE.MeshBasicMaterial({color:'#f2ecd6'});
for(let x=-145;x<150;x+=8){const d=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.35),dashM);d.rotation.x=-Math.PI/2;d.position.set(x,.08,0);scene.add(d);}
const kerb=mat('#d9d4c4');[[0,5.8,300,.6],[0,-5.8,300,.6]].forEach(([x,z,w,d])=>plane(w,d,'#d9d4c4',x,z,.07));
// neighbourhood: houses, shops and trees along the streets
const wallC=['#f3e6c8','#e7efe3','#f6d6b5','#dfe7ee','#f1dcc8','#e9e2f0'],roofC=['#b5533b','#5b6d7a','#2f6b4f','#8a5a3c'];
function house(x,z,rot,big){const g=new THREE.Group();const w=(big?12:7)+rnd()*4,d=6+rnd()*4,h=(big?7:3.4)+rnd()*2;
  const b=cast(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(wallC[Math.floor(rnd()*wallC.length)])));b.position.y=h/2;g.add(b);
  if(big){const r=cast(new THREE.Mesh(new THREE.BoxGeometry(w+.4,.5,d+.4),mat('#9aa3a6')));r.position.y=h+.25;g.add(r);}
  else{const r=cast(new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.75,2.4,4),mat(roofC[Math.floor(rnd()*4)])));r.position.y=h+1.2;r.rotation.y=Math.PI/4;r.scale.z=d/w;g.add(r);}
  g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);}
const leaf=['#3f7d3a','#4c8f3f','#2f6b35','#5a9a45'].map(c=>mat(c,{roughness:.95}));const trunk=mat('#7a5a3a');
function tree(x,z,s=1){const g=new THREE.Group();const t=cast(new THREE.Mesh(new THREE.CylinderGeometry(.3*s,.45*s,3*s,6),trunk));t.position.y=1.5*s;g.add(t);
  for(let i=0;i<2;i++){const c=cast(new THREE.Mesh(new THREE.IcosahedronGeometry((1.8+rnd())*s,0),leaf[Math.floor(rnd()*4)]));c.position.set((rnd()-.5)*1.5*s,(3.6+rnd()*1.2)*s,(rnd()-.5)*1.5*s);g.add(c);}
  g.position.set(x,0,z);scene.add(g);}
function palm(x,z){const g=new THREE.Group();const h=7+rnd()*3;const t=cast(new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,h,6),mat('#8a6a48')));t.position.y=h/2;g.add(t);
  const fm=leaf[Math.floor(rnd()*4)];for(let i=0;i<7;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.5,4.4,4),fm);f.geometry.translate(0,2.2,0);f.position.y=h;f.rotation.z=Math.PI/2.5;f.rotation.y=i*Math.PI*2/7;f.castShadow=true;g.add(f);}
  g.position.set(x,0,z);scene.add(g);}
const avoid=(x,z)=>(x>-14&&x<72&&z<-52&&z>-108)||Math.abs(z)<9||(x>36&&x<48&&z<0&&z>-60)||(Math.abs(x+95)<9);
for(let x=-140;x<140;x+=13){[-1,1].forEach(s=>{const z=s*(16+rnd()*6);if(!avoid(x,z)&&rnd()<.82)house(x+rnd()*3,z,s>0?Math.PI:0,rnd()<.18);});}
for(let i=0;i<110;i++){const x=(rnd()-.5)*300,z=(rnd()-.5)*260;if(avoid(x,z)||Math.abs(z)<24&&rnd()<.6)continue;rnd()<.4?palm(x,z):tree(x,z,.9+rnd()*.5);}
for(let z=-12;z>-50;z-=8){[34,50].forEach(x=>{if(rnd()<.7)house(x+(x<42?-4:4),z,x<42?Math.PI/2:-Math.PI/2,false);});}

// ---------- the school compound at No 5 Jeck Close ----------
const SCH=new THREE.Group();scene.add(SCH);
const sand=plane(80,52,'#d8b98a',29,-81,.04);
const wallM=mat('#efe4c7'),capM=mat('#17543d');
function wall(x1,z1,x2,z2){const len=Math.hypot(x2-x1,z2-z1);const w=cast(new THREE.Mesh(new THREE.BoxGeometry(len,2.2,.5),wallM));w.position.set((x1+x2)/2,1.1,(z1+z2)/2);w.rotation.y=-Math.atan2(z2-z1,x2-x1);scene.add(w);
  const c=new THREE.Mesh(new THREE.BoxGeometry(len,.3,.7),capM);c.position.set(w.position.x,2.35,w.position.z);c.rotation.y=w.rotation.y;scene.add(c);}
wall(-11,-55,38,-55);wall(46,-55,70,-55);wall(70,-55,70,-107);wall(70,-107,-11,-107);wall(-11,-107,-11,-55);
// gate
const gp=mat('#0f3b2b');[37.4,46.6].forEach(x=>{const p=cast(new THREE.Mesh(new THREE.BoxGeometry(1.2,4.2,1.2),gp));p.position.set(x,2.1,-55);scene.add(p);});
const arch=cast(new THREE.Mesh(new THREE.BoxGeometry(10.4,1.4,.8),mat('#f2c318',{roughness:.5})));arch.position.set(42,4.6,-55);scene.add(arch);
// gate sign with the school name
{const c=document.createElement('canvas');c.width=1024;c.height=140;const x=c.getContext('2d');const draw=()=>{x.fillStyle='#f2c318';x.fillRect(0,0,1024,140);x.fillStyle='#0f3b2b';x.textAlign='center';x.textBaseline='middle';x.font='600 64px "Libre Caslon Display", Georgia, serif';x.fillText('JECK Comprehensive College',512,74);};draw();
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;document.fonts&&document.fonts.ready.then(()=>{draw();t.needsUpdate=true;});
 const s=new THREE.Mesh(new THREE.PlaneGeometry(10,1.36),new THREE.MeshBasicMaterial({map:t}));s.position.set(42,4.6,-54.58);scene.add(s);}
// classroom block (green with cream pillars, like the photo)
function block(cx,cz,len,rot,wallColor,railColor){
  const g=new THREE.Group();const D=8,H=10.5;
  const body=cast(new THREE.Mesh(new THREE.BoxGeometry(len,H,D),mat(wallColor)));body.position.y=H/2;g.add(body);
  const roof=cast(new THREE.Mesh(new THREE.BoxGeometry(len+1.2,.6,D+2.4),mat('#56706a',{roughness:.7})));roof.position.y=H+.3;g.add(roof);
  const pil=mat('#f1e9cf');

  for(let f=1;f<=3;f++){const sl=new THREE.Mesh(new THREE.BoxGeometry(len,.35,2.4),pil);sl.position.set(0,f*3.4-3.2,D/2+1.2);if(f>1)g.add(sl);
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,1,.12),mat(railColor));rail.position.set(0,f*3.4-2.6,D/2+2.35);if(f>1)g.add(rail);}
  const winM=mat('#1f3b33',{roughness:.4});
  for(let f=0;f<3;f++)for(let i=0;i<Math.floor(len/4);i++){const w=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),winM);w.position.set(-len/2+2+i*4,f*3.4+1.8,D/2+.02);g.add(w);}
  g.position.set(cx,0,cz);g.rotation.y=rot;scene.add(g);return g;}
block(25,-82,30,Math.PI/2,'#7fc48f','#1f5e43');   // west block: classrooms + laboratory
block(42,-99,30,0,'#7fc48f','#1f5e43');          // north block: classrooms + library

// graduation hall near the gate
{const h=cast(new THREE.Mesh(new THREE.BoxGeometry(12,6,9),mat('#e8b48e')));h.position.set(61,3,-63);scene.add(h);
 const r=cast(new THREE.Mesh(new THREE.ConeGeometry(9,3,4),mat('#b5533b')));r.position.set(61,7.5,-63);r.rotation.y=Math.PI/4;r.scale.set(1,1,.75);scene.add(r);}
// tents for cultural day in front of the main building
[[48.5,-74],[48.5,-86]].forEach(([x,z])=>{const t=cast(new THREE.Mesh(new THREE.ConeGeometry(4,3,4),mat('#ffffff',{roughness:.6})));t.position.set(x,4.2,z);t.rotation.y=Math.PI/4;scene.add(t);
  [[-2.6,-2.6],[2.6,-2.6],[-2.6,2.6],[2.6,2.6]].forEach(([a,b])=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,2.8,5),mat('#dddddd'));p.position.set(x+a,1.4,z+b);scene.add(p);});});
// sports field with a running track
plane(22,40,'#6fa85a',2,-81,.06);
{const tr=new THREE.Mesh(new THREE.RingGeometry(7.6,8.6,48),new THREE.MeshBasicMaterial({color:'#f5f1e4'}));tr.rotation.x=-Math.PI/2;tr.scale.set(1,2.1,1);tr.position.set(2,.09,-81);scene.add(tr);}
[[2,-63],[2,-99]].forEach(([x,z])=>{const g=new THREE.Group();[-2,2].forEach(o=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.4,6),mat('#ffffff'));p.position.set(o,1.2,0);g.add(p);});const b=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,4,6),mat('#ffffff'));b.rotation.z=Math.PI/2;b.position.y=2.4;g.add(b);g.position.set(x,0,z);scene.add(g);});
// flag pole with the crest colours
{const p=cast(new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,12,8),mat('#dddddd',{metalness:.6,roughness:.3})));p.position.set(34,6,-62);scene.add(p);
 const fg=new THREE.PlaneGeometry(4,2.6,12,4);const fl=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:'#17543d',side:THREE.DoubleSide,roughness:.8}));fl.position.set(36.1,10.6,-62);scene.add(fl);
 const st=new THREE.Mesh(new THREE.PlaneGeometry(4,.6),new THREE.MeshBasicMaterial({color:'#f2c318',side:THREE.DoubleSide}));st.position.set(36.1,10.6,-61.98);scene.add(st);
 window.__flag={fl,fg,base:fg.attributes.position.array.slice()};}
for(let i=0;i<14;i++){const x=-8+rnd()*76,z=-58-rnd()*3;if(x>34&&x<50)continue;palm(x,z);}
[-14,-30].forEach(z=>{palm(36,z);palm(48,z-5);});

/* ---------- vehicles ---------- */
function makeBus(){
  const bus=new THREE.Group();const L=8.4,W=2.7;
  const c=document.createElement('canvas');c.width=1024;c.height=160;const x=c.getContext('2d');const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  const crest=new Image();crest.src=(window.JECK_DATA&&window.JECK_DATA['assets/crest.png'])||'assets/crest.png';
  const draw=()=>{x.fillStyle='#13603f';x.fillRect(0,0,1024,160);x.fillStyle='#f2c318';x.fillRect(0,0,1024,14);if(crest.complete&&crest.naturalWidth)x.drawImage(crest,40,28,112,106);
    x.fillStyle='#fff';x.textBaseline='middle';x.font='52px "Libre Caslon Display", Georgia, serif';x.fillText('JECK Comprehensive College',176,72);x.font='700 24px "Hanken Grotesk", sans-serif';x.fillStyle='#f2c318';x.fillText('ACADEMIC & MORAL EXCELLENCE',178,122);t.needsUpdate=true;};
  draw();crest.onload=draw;document.fonts&&document.fonts.ready.then(draw);
  const side=mat('#fff',{map:t,roughness:.5}),green=mat('#13603f',{roughness:.5}),white=mat('#f7f7f2',{roughness:.5}),dark=mat('#1d2422');
  const lower=cast(new THREE.Mesh(new THREE.BoxGeometry(L,1.5,W),[green,green,green,green,side,side]));lower.position.y=1.35;bus.add(lower);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(L-.2,1.4,W-.05),new THREE.MeshStandardMaterial({color:'#9cc6d6',roughness:.1,metalness:.3}));glass.position.y=2.8;bus.add(glass);
  for(let i=0;i<=6;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.14,1.42,W+.02),white);p.position.set(-L/2+.1+i*(L-.2)/6,2.8,0);bus.add(p);}
  const roof=cast(new THREE.Mesh(new THREE.BoxGeometry(L+.1,.32,W+.1),white));roof.position.y=3.65;bus.add(roof);
  const gold=new THREE.Mesh(new THREE.BoxGeometry(L+.04,.14,W+.04),mat('#f2c318'));gold.position.y=2.12;bus.add(gold);
  const hl=new THREE.MeshBasicMaterial({color:'#fffbe6'});[-.95,.95].forEach(z=>{const h=new THREE.Mesh(new THREE.CircleGeometry(.22,14),hl);h.position.set(L/2+.02,1.1,z);h.rotation.y=Math.PI/2;bus.add(h);});
  const wg=new THREE.CylinderGeometry(.55,.55,.42,16);wg.rotateX(Math.PI/2);
  bus.wheels=[[-2.7,-1.3],[-2.7,1.3],[2.6,-1.3],[2.6,1.3]].map(([a,b])=>{const w=cast(new THREE.Mesh(wg,dark));w.position.set(a,.55,b);bus.add(w);return w;});
  scene.add(bus);return bus;}
const bus=makeBus();
const cars=[];const carC=['#c8322b','#2f4a8a','#e9e4d8','#3b3b3b','#d9a12b'];
for(let i=0;i<7;i++){const g=new THREE.Group();const c=mat(carC[i%5],{roughness:.4,metalness:.2});
  const b=cast(new THREE.Mesh(new THREE.BoxGeometry(4.2,1.1,2),c));b.position.y=.85;g.add(b);
  const t=cast(new THREE.Mesh(new THREE.BoxGeometry(2.4,.9,1.8),mat('#9cc6d6',{roughness:.1})));t.position.set(-.2,1.8,0);g.add(t);
  scene.add(g);cars.push({g,x:-150+i*45+rnd()*10,dir:i%2?1:-1,sp:9+rnd()*6});}

/* ---------- route ---------- */
const route=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-140,0,2.8),new THREE.Vector3(-80,0,2.8),new THREE.Vector3(0,0,2.8),new THREE.Vector3(30,0,2.8),new THREE.Vector3(38,0,1.5),
  new THREE.Vector3(43.5,0,-6),new THREE.Vector3(43.5,0,-30),new THREE.Vector3(43,0,-50),new THREE.Vector3(42,0,-60),new THREE.Vector3(40,0,-70)],false,'catmullrom',.2);
const RLEN=route.getLength();

/* ---------- labels ---------- */
const labels=$('labels');
const roadLabels=[
 {t:'Oro-Igwe Road',p:new THREE.Vector3(-40,1,0)},{t:'Oro-Igwe Road',p:new THREE.Vector3(105,1,0)},
 {t:'Jeck Close',p:new THREE.Vector3(42,1,-32)},{t:'Elimgbu',p:new THREE.Vector3(-70,14,-60)},
 {t:'JECK Comprehensive College',p:new THREE.Vector3(30,16,-81),cls:'school'}].map(l=>{const e=document.createElement('span');e.className='rlabel'+(l.cls?' '+l.cls:'');e.textContent=l.t;labels.appendChild(e);return Object.assign(l,{e});});
const pins=PLACES.map((pl,i)=>{const b=document.createElement('button');b.className='pin';b.type='button';b.innerHTML=`<b>${i+1}</b>${pl.name}`;b.addEventListener('click',()=>enter(i));labels.appendChild(b);
  return {e:b,p:new THREE.Vector3(pl.at[0],pl.id==='field'?3:(pl.id==='hall'?9:pl.id==='courtyard'?2:12),pl.at[1])};});
const tmp=new THREE.Vector3();
function project(list){const w=innerWidth,h=innerHeight;list.forEach(l=>{tmp.copy(l.p).project(camera);const vis=tmp.z<1&&tmp.x>-1.2&&tmp.x<1.2&&tmp.y>-1.2&&tmp.y<1.2;
  l.e.style.visibility=vis?'visible':'hidden';if(vis)l.e.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-50%)`;});}

/* ---------- camera states ---------- */
let mode='intro';// intro | ride | campus | fly
let rideT=0;const RIDE=reduce?.1:22;
const ORBIT={tx:34,tz:-81,az:-.55,el:.78,dist:110};
let orbitTarget=Object.assign({},ORBIT);
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function orbitPos(o,out){const d=o.dist;out.set(o.tx+Math.sin(o.az)*Math.cos(o.el)*d,Math.sin(o.el)*d,o.tz+Math.cos(o.az)*Math.cos(o.el)*d);return out;}
// intro view: high over the neighbourhood
camPos.set(-40,120,120);camLook.set(10,0,-30);camera.position.copy(camPos);camera.lookAt(camLook);
let fly=null;
function flyTo(pos,look,dur,done){fly={fp:camera.position.clone(),fl:camLook.clone(),tp:pos.clone(),tl:look.clone(),t:0,dur:reduce?.01:dur,done};}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- sound ---------- */
let actx=null;
function horn(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[[311,392,0,.26],[311,392,.32,.42]].forEach(([a,b,s,d])=>[a,b].forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(.05,t+s+.02);g.gain.setValueAtTime(.05,t+s+d-.05);g.gain.linearRampToValueAtTime(0,t+s+d);o.connect(g);g.connect(actx.destination);o.start(t+s);o.stop(t+s+d+.05);}));}catch(e){}}

/* ---------- flow ---------- */
function startRide(){ $('intro').hidden=true;$('route').hidden=false;horn();camPos.copy(camera.position);mode='ride';rideT=0;}
function toCampus(){
  $('intro').hidden=true;$('route').hidden=true;mode='fly';
  const p=route.getPointAt(1);bus.position.copy(p);
  orbitTarget=Object.assign({},ORBIT);if(innerWidth<700)orbitTarget.dist=150;
  flyTo(orbitPos(orbitTarget,new THREE.Vector3()),new THREE.Vector3(ORBIT.tx,0,ORBIT.tz),2.4,()=>{mode='campus';document.body.classList.add('on-campus');$('btnStops').hidden=false;
    const t=document.createElement('div');t.className='toast';t.textContent='Welcome to JECK. Tap a place to step inside.';document.body.appendChild(t);setTimeout(()=>t.remove(),4200);});
}
$('start').onclick=startRide;$('skip').onclick=toCampus;$('skip2').onclick=toCampus;

/* orbit controls on campus */
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(mode!=='campus')return;drag={x:e.clientX,y:e.clientY,az:orbitTarget.az,el:orbitTarget.el};canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{if(!drag)return;orbitTarget.az=drag.az-(e.clientX-drag.x)*.006;orbitTarget.el=Math.max(.32,Math.min(1.35,drag.el+(e.clientY-drag.y)*.004));});
const endDrag=()=>{drag=null;canvas.classList.remove('drag');};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{if(mode!=='campus')return;e.preventDefault();orbitTarget.dist=Math.max(45,Math.min(190,orbitTarget.dist*(1+e.deltaY*.001)));},{passive:false});

/* places */
const seen=new Set();let current=-1,filmCtl=null;
function enter(i){
  if(mode!=='campus'&&mode!=='place')return;
  const pl=PLACES[i];current=i;
  const look=pins[i].p.clone();look.y=0;
  const dir=camera.position.clone().sub(look).setY(0).normalize();
  const pos=look.clone().add(dir.multiplyScalar(14)).setY(9);
  const show=()=>{
    const f=$('flash');f.classList.add('on');
    setTimeout(()=>{
      if(filmCtl){filmCtl.destroy();filmCtl=null;}
      const host=$('filmHost');host.innerHTML='';
      const el=document.createElement('div');el.className='film';el.dataset.manual='1';el.dataset.dur='12';el.dataset.depth='.038';
      el.setAttribute('role','img');el.setAttribute('aria-label',pl.name);
      el.dataset.scenes=JSON.stringify(pl.scenes.map(([n,fx,fy])=>({img:`assets/${n}.jpg`,depth:`assets/depth/${n}.png`,fx,fy})));
      host.appendChild(el);filmCtl=window.JeckFilm?window.JeckFilm.init(el):null;
      $('pK').textContent=`Place ${i+1} of ${PLACES.length} · ${pl.k}`;$('pT').textContent=pl.name;$('pP').textContent=pl.p;
      const P=$('place');P.hidden=false;P.classList.remove('in');void P.offsetWidth;P.classList.add('in');
      seen.add(i);pins[i].e.classList.add('seen');mode='place';
      f.classList.remove('on');
    },450);
  };
  if(mode==='place'){show();return;}
  mode='fly';flyTo(pos,look,1.1,show);
}
function leave(){
  if(filmCtl){filmCtl.destroy();filmCtl=null;}
  $('place').hidden=true;$('filmHost').innerHTML='';
  mode='fly';flyTo(orbitPos(orbitTarget,new THREE.Vector3()),new THREE.Vector3(orbitTarget.tx,0,orbitTarget.tz),1.2,()=>mode='campus');
}
$('pNext').onclick=()=>enter((current+1)%PLACES.length);
$('pBack').onclick=leave;$('placeClose').onclick=leave;
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('place').hidden)leave();else if(!$('stopsPanel').hidden)$('stopsPanel').hidden=true;}});
const grid=$('stopGrid');
PLACES.forEach((pl,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<img src="assets/${pl.img}.jpg" alt=""><span>${i+1}. ${pl.name}</span>`;b.onclick=()=>{$('stopsPanel').hidden=true;enter(i);};grid.appendChild(b);});
$('btnStops').onclick=()=>{$('stopsPanel').hidden=false;};$('stopsClose').onclick=()=>{$('stopsPanel').hidden=true;};

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?55:45;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clk=new THREE.Clock();
const routeSteps=[...document.querySelectorAll('#route li')];
const up=new THREE.Vector3(0,1,0);
function placeBus(u){const p=route.getPointAt(u),t=route.getTangentAt(u);bus.position.copy(p);bus.rotation.y=Math.atan2(-t.z,t.x);return {p,t};}
placeBus(0);
function frame(){
  requestAnimationFrame(frame);
  if(mode==='place'){return;}
  const dt=Math.min(clk.getDelta(),.05),time=clk.elapsedTime;
  cars.forEach(c=>{c.x+=c.dir*c.sp*dt;if(c.x>150)c.x=-150;if(c.x<-150)c.x=150;c.g.position.set(c.x,0,c.dir>0?2.8:-2.8);c.g.rotation.y=c.dir>0?0:Math.PI;});
  if(window.__flag){const {fg,base}=window.__flag;const a=fg.attributes.position;for(let i=0;i<a.count;i++){const x=base[i*3];a.setZ(i,Math.sin(x*1.6-time*5)*.25*((x+2)/4));}a.needsUpdate=true;}
  if(mode==='intro'){const a=time*.05;camera.position.set(10+Math.sin(a)*150,110,-30+Math.cos(a)*150);camLook.set(10,0,-30);camera.lookAt(camLook);}
  if(mode==='ride'){
    rideT=Math.min(1,rideT+dt/RIDE);
    const u=ease(rideT)*.98+rideT*.02;
    const {p,t}=placeBus(Math.min(u,1));
    bus.wheels.forEach(w=>w.rotation.z-=dt*8);
    const behind=p.clone().sub(t.clone().multiplyScalar(18)).add(new THREE.Vector3(0,10,0)).add(t.clone().cross(up).multiplyScalar(-6));
    camPos.lerp(behind,rideT<.02?.04:.06);camLook.lerp(p.clone().add(t.clone().multiplyScalar(14)),.08);
    camera.position.copy(camPos);camera.lookAt(camLook);
    const step=u<.42?0:u<.86?1:2;routeSteps.forEach((li,i)=>li.classList.toggle('on',i===step));
    if(rideT>=1)toCampus();
  }
  if(fly){fly.t+=dt;const k=ease(Math.min(1,fly.t/fly.dur));camera.position.lerpVectors(fly.fp,fly.tp,k);camLook.lerpVectors(fly.fl,fly.tl,k);camera.lookAt(camLook);camPos.copy(camera.position);
    if(fly.t>=fly.dur){const d=fly.done;fly=null;d&&d();}}
  else if(mode==='campus'){orbitTarget.az+=drag?0:dt*.02;const want=orbitPos(orbitTarget,new THREE.Vector3());camera.position.lerp(want,.08);camLook.lerp(new THREE.Vector3(orbitTarget.tx,0,orbitTarget.tz),.08);camera.lookAt(camLook);}
  renderer.render(scene,camera);
  project(roadLabels);project(pins);
}
frame();
})();
