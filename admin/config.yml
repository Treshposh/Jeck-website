# Generated by _tools/build_cms.py. The admin panel for the JECK website.
backend:
  name: github
  repo: Treshposh/Jeck-website
  branch: main
  commit_messages:
    update: 'Website edit: {{collection}} “{{slug}}”'
    uploadMedia: 'Website edit: upload “{{path}}”'
    deleteMedia: 'Website edit: delete “{{path}}”'
site_url: https://treshposh.github.io/Jeck-website/home.html
display_url: https://treshposh.github.io/Jeck-website/home.html
logo_url: https://treshposh.github.io/Jeck-website/assets/crest.png
media_folder: assets/uploads
public_folder: assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800
collections:
- name: settings
  label: Contact details and announcement
  label_singular: Settings
  icon: settings
  files:
  - name: settings
    label: Contact details and announcement
    file: content/settings.json
    fields:
    - name: notice_show
      label: Show the announcement bar
      widget: boolean
      required: false
      hint: A green bar across the top of every page. Switch it off when the news is over.
    - name: notice_text
      label: Announcement
      widget: string
      required: false
    - name: notice_link
      label: Announcement opens
      widget: string
      required: false
      hint: Optional. A page such as admissions.html, or a full web address.
    - name: phone1
      label: Main phone number
      widget: string
      required: false
      hint: Shown in the top bar and the footer of every page.
    - name: phone2
      label: Second phone number
      widget: string
      required: false
    - name: whatsapp
      label: WhatsApp number
      widget: string
      required: false
      hint: Country code and number with no spaces or +, for example 2349130704152. Every WhatsApp button and enquiry form sends messages here.
      pattern:
      - ^[0-9]{10,15}$
      - Use digits only, starting with 234, for example 2349130704152.
    - name: email
      label: Email address
      widget: string
      required: false
    - name: address
      label: Address
      widget: string
      required: false
    - name: hours
      label: Opening hours
      widget: string
      required: false
